# /etc/nginx/conf.d/ai-course-limits.conf — уровень http.
# Зоны используются только в server-блоке davydovaai.ru (deploy/nginx.conf).

# Общий лимит на динамику (FastAPI). Статика /static/ идёт мимо.
limit_req_zone  $binary_remote_addr zone=ai_general:10m rate=20r/s;
# Логин/регистрация/сброс пароля/платежи: 10 в минуту + burst 10.
limit_req_zone  $binary_remote_addr zone=ai_auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ai_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# Не светим версию nginx в заголовках и на страницах ошибок.
server_tokens off;
