# /etc/nginx/sites-available/ai-course  (симлинк в sites-enabled)
# Зоны лимитов — в deploy/nginx-limits.conf -> /etc/nginx/conf.d/ai-course-limits.conf
#
# Применение на сервере:
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    server_name davydovaai.ru www.davydovaai.ru;

    # Аватар в кабинете разрешён до 5 МБ; дефолт nginx — 1 МБ.
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/davydovaai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davydovaai.ru/privkey.pem;

    # Медленные клиенты (slowloris) не держат соединения воркеров.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;

    # Не больше 40 одновременных соединений с одного IP.
    limit_conn ai_conn 40;

    location /static/videos/ {
        return 404;
    }

    location /static/ {
        alias /root/ai-course-platform/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        sendfile on;
    }

    # Вебхуки платёжек — без rate limit: ЮKassa/ProOnline ретраят, 429 им отдавать нельзя.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, а не $proxy_add_x_forwarded_for: иначе клиент подставляет
        # свой X-Forwarded-For и подделывает IP (обход лимитов и проверки IP ЮKassa).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Логин/регистрация/сброс пароля/админ-логин/создание платежа — жёсткий лимит.
    location ~ ^/(auth/(login|register|password-reset/request|password-setup/request|resend-verification)|admin/login|api/v1/payments/) {
        limit_req zone=ai_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=ai_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name davydovaai.ru www.davydovaai.ru;
    client_max_body_size 10M;
    return 301 https://$server_name$request_uri;
}
