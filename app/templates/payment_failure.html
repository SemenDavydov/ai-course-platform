<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ошибка оплаты</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-md overflow-hidden">
    <div class="bg-red-500 px-8 py-8 text-center">
      <div class="text-5xl mb-3">✕</div>
      <h1 class="text-white text-2xl font-bold">Оплата не прошла</h1>
    </div>
    <div class="px-8 py-8 text-center">
      <p class="text-gray-700 mb-2">Что-то пошло не так. Деньги не списаны.</p>
      <p class="text-gray-500 text-sm mb-6">Попробуйте ещё раз или напишите нам, если проблема повторяется.</p>
      <a href="/"
         class="inline-block bg-violet-600 hover:bg-violet-700 text-white font-semibold px-8 py-3 rounded-xl transition">
        Попробовать снова
      </a>
      <p class="text-gray-500 text-sm mt-6">
        Можно оформить доступ через
        <a href="{{ telegram_bot_url }}" target="_blank" rel="noopener noreferrer" class="text-sky-600 hover:underline">Telegram-бота</a>.
      </p>
    </div>
  </div>
</body>
</html>
