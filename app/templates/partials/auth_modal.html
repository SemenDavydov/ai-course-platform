<!-- Auth Modal (Login / Register) -->
<div id="auth-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 overflow-y-auto">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAuthModal()"></div>

  <!-- Dialog -->
  <div class="modal-panel relative w-full max-w-md bg-white rounded-2xl shadow-2xl">

    <!-- Header -->
    <div class="gradient-bg px-6 pt-6 pb-0">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-white font-bold text-xl">Доступ к курсу</h2>
        <button onclick="closeAuthModal()" class="text-white/70 hover:text-white text-2xl leading-none">&times;</button>
      </div>
      <!-- Tabs -->
      <div class="flex gap-0">
        <button id="tab-login" onclick="switchTab('login')"
                class="tab-btn flex-1 py-3 text-sm font-semibold text-white border-b-2 border-white transition-all">
          Вход
        </button>
        <button id="tab-register" onclick="switchTab('register')"
                class="tab-btn flex-1 py-3 text-sm font-semibold text-white/60 border-b-2 border-transparent transition-all">
          Регистрация
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="px-6 py-6">

      <!-- Error banner -->
      <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
      <!-- Success banner -->
      <div id="auth-success" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm"></div>

      <!-- LOGIN FORM -->
      <form id="form-login" onsubmit="submitLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="login-email" required autocomplete="email"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
          <input type="password" id="login-password" required autocomplete="current-password"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 placeholder="Введите пароль">
        </div>
        <div class="text-right">
          <button type="button" onclick="showResetForm()"
                  class="text-xs text-purple-600 hover:underline">Забыли пароль?</button>
        </div>
        <button type="submit" id="login-submit"
                class="w-full gradient-bg text-white font-semibold py-3 rounded-xl hover:opacity-90 transition text-sm">
          Войти
        </button>
        <p class="text-center text-xs text-gray-500">
          Нет аккаунта?
          <button type="button" onclick="switchTab('register')" class="text-purple-600 hover:underline">Зарегистрируйтесь</button>
        </p>
      </form>

      <!-- REGISTER FORM -->
      <form id="form-register" onsubmit="submitRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="reg-email" required autocomplete="email"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
          <input type="password" id="reg-password" required autocomplete="new-password"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 placeholder="Не менее 8 символов">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Повторите пароль</label>
          <input type="password" id="reg-password2" required autocomplete="new-password"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 placeholder="Повторите пароль">
        </div>
        <div class="flex items-start gap-3">
          <input type="checkbox" id="reg-offer" required
                 class="mt-1 w-4 h-4 rounded border-gray-300 text-purple-600 focus:ring-purple-500">
          <label for="reg-offer" class="text-xs text-gray-600 leading-relaxed">
            Я принимаю <a href="/offer" target="_blank" class="text-purple-600 hover:underline">публичную оферту</a>
            и <a href="/privacy" target="_blank" class="text-purple-600 hover:underline">политику конфиденциальности</a>
          </label>
        </div>
        <button type="submit" id="reg-submit"
                class="w-full gradient-bg text-white font-semibold py-3 rounded-xl hover:opacity-90 transition text-sm">
          Создать аккаунт
        </button>
        <p class="text-center text-xs text-gray-500">
          Уже есть аккаунт?
          <button type="button" onclick="switchTab('login')" class="text-purple-600 hover:underline">Войти</button>
        </p>
      </form>

      <!-- PASSWORD RESET FORM -->
      <form id="form-reset" onsubmit="submitReset(event)" class="space-y-4 hidden">
        <p class="text-sm text-gray-600">Введите email — пришлём ссылку для сброса пароля.</p>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="reset-email" required autocomplete="email"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 placeholder="you@example.com">
        </div>
        <button type="submit"
                class="w-full gradient-bg text-white font-semibold py-3 rounded-xl hover:opacity-90 transition text-sm">
          Отправить письмо
        </button>
        <p class="text-center text-xs text-gray-500">
          <button type="button" onclick="switchTab('login')" class="text-purple-600 hover:underline">← Назад</button>
        </p>
      </form>

      <!-- SETUP PASSWORD HINT (shown after 409 login) -->
      <div id="setup-hint" class="hidden text-center space-y-4">
        <p class="text-sm text-gray-600">
          Ваш аккаунт был создан через Telegram. Установите пароль для входа на сайт.
        </p>
        <button onclick="requestPasswordSetup()"
                class="w-full gradient-bg text-white font-semibold py-3 rounded-xl hover:opacity-90 transition text-sm">
          Получить письмо с паролем
        </button>
        <p class="text-center text-xs text-gray-500">
          <button type="button" onclick="switchTab('login')" class="text-purple-600 hover:underline">← Назад</button>
        </p>
      </div>

    </div>
  </div>
</div>

<script>
  // ---- State ----
  let _setupEmail = '';

  // ---- Open / Close ----
  function openAuthModal(defaultTab) {
    switchTab(defaultTab || 'login');
    clearAuthMessages();
    document.getElementById('auth-modal').classList.remove('hidden');
    document.getElementById('auth-modal').classList.add('flex');
    document.body.style.overflow = 'hidden';
  }

  function closeAuthModal() {
    document.getElementById('auth-modal').classList.add('hidden');
    document.getElementById('auth-modal').classList.remove('flex');
    document.body.style.overflow = '';
  }

  // Close on Escape
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAuthModal(); });

  // ---- Tab switching ----
  function switchTab(tab) {
    clearAuthMessages();
    ['login', 'register'].forEach(t => {
      document.getElementById('form-' + t).classList.add('hidden');
      const btn = document.getElementById('tab-' + t);
      btn.classList.remove('text-white', 'border-white');
      btn.classList.add('text-white/60', 'border-transparent');
    });
    document.getElementById('form-reset').classList.add('hidden');
    document.getElementById('setup-hint').classList.add('hidden');

    const activeForm = document.getElementById('form-' + tab);
    if (activeForm) activeForm.classList.remove('hidden');
    const activeBtn = document.getElementById('tab-' + tab);
    if (activeBtn) {
      activeBtn.classList.add('text-white', 'border-white');
      activeBtn.classList.remove('text-white/60', 'border-transparent');
    }
  }

  function showResetForm() {
    clearAuthMessages();
    ['login', 'register'].forEach(t => document.getElementById('form-' + t).classList.add('hidden'));
    document.getElementById('form-reset').classList.remove('hidden');
    document.getElementById('setup-hint').classList.add('hidden');
  }

  // ---- Messages ----
  function clearAuthMessages() {
    ['auth-error', 'auth-success'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.textContent = '';
    });
  }

  function showAuthError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function showAuthSuccess(msg) {
    const el = document.getElementById('auth-success');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  // ---- Login ----
  async function submitLogin(e) {
    e.preventDefault();
    clearAuthMessages();
    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.textContent = 'Входим...';

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password}),
        credentials: 'same-origin',
      });

      if (res.ok) {
        showAuthSuccess('Вход выполнен! Загружаем...');
        setTimeout(() => location.reload(), 800);
        return;
      }

      const data = await res.json();
      if (res.status === 409) {
        // Password not set — show setup hint
        _setupEmail = email;
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('setup-hint').classList.remove('hidden');
      } else {
        showAuthError(data.detail || 'Неверный email или пароль');
      }
    } catch {
      showAuthError('Ошибка сети. Попробуйте снова.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }

  // ---- Register ----
  async function submitRegister(e) {
    e.preventDefault();
    clearAuthMessages();

    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    if (password !== password2) {
      showAuthError('Пароли не совпадают');
      return;
    }
    if (password.length < 8) {
      showAuthError('Пароль должен быть не короче 8 символов');
      return;
    }

    const btn = document.getElementById('reg-submit');
    btn.disabled = true;
    btn.textContent = 'Создаём аккаунт...';

    const email = document.getElementById('reg-email').value;
    const accepted_offer = document.getElementById('reg-offer').checked;

    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password, accepted_offer}),
        credentials: 'same-origin',
      });

      const data = await res.json();
      if (res.ok || res.status === 201) {
        showAuthSuccess('Аккаунт создан! Проверьте почту для подтверждения.');
        setTimeout(() => location.reload(), 2000);
        return;
      }
      if (res.status === 409) {
        showAuthError('Этот email уже зарегистрирован. Войдите или восстановите пароль.');
      } else {
        showAuthError(data.detail || 'Ошибка регистрации');
      }
    } catch {
      showAuthError('Ошибка сети. Попробуйте снова.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Создать аккаунт';
    }
  }

  // ---- Password reset ----
  async function submitReset(e) {
    e.preventDefault();
    clearAuthMessages();
    const email = document.getElementById('reset-email').value;
    try {
      await fetch('/auth/password-reset/request', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email}),
        credentials: 'same-origin',
      });
      showAuthSuccess('Если email зарегистрирован — письмо отправлено.');
    } catch {
      showAuthError('Ошибка сети. Попробуйте снова.');
    }
  }

  // ---- Password setup (migrated users) ----
  async function requestPasswordSetup() {
    clearAuthMessages();
    try {
      await fetch('/auth/password-setup/request', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: _setupEmail}),
        credentials: 'same-origin',
      });
      showAuthSuccess('Письмо отправлено! Проверьте почту.');
    } catch {
      showAuthError('Ошибка сети. Попробуйте снова.');
    }
  }
</script>
