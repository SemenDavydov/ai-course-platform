<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Course Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        #admin-drawer {
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #admin-drawer.open { transform: translateX(0); }
        #admin-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        #admin-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        body.admin-drawer-open { overflow: hidden; }
        .admin-main { overflow-x: auto; }
        .admin-card {
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            border: 1px solid #f3f4f6;
        }
        .admin-card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .admin-stat {
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 1.25rem 1.5rem;
            border-left: 4px solid #3b82f6;
        }
        .admin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.25rem;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            transition: background-color .15s, color .15s;
            white-space: nowrap;
        }
        .admin-btn-primary { background: #3b82f6; color: #fff; }
        .admin-btn-primary:hover { background: #2563eb; }
        .admin-btn-success { background: #22c55e; color: #fff; }
        .admin-btn-success:hover { background: #16a34a; }
        .admin-btn-warning { background: #eab308; color: #fff; }
        .admin-btn-warning:hover { background: #ca8a04; }
        .admin-btn-danger { background: #ef4444; color: #fff; }
        .admin-btn-danger:hover { background: #dc2626; }
        .admin-btn-secondary { background: #6b7280; color: #fff; }
        .admin-btn-secondary:hover { background: #4b5563; }
        .admin-btn-sm { font-size: 0.75rem; padding: 0.25rem 0.625rem; }
        .admin-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .admin-form-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.75rem; }
        .admin-alert {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .admin-alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .admin-alert-info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        @media (max-width: 640px) {
            table { font-size: 0.85rem; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-lg mb-6 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-14 sm:h-16 gap-3">
                <div class="flex items-center gap-2 min-w-0">
                    <button type="button" id="admin-nav-toggle"
                            class="sm:hidden p-2 rounded-md text-gray-700 hover:bg-gray-100 shrink-0"
                            aria-label="Открыть меню"
                            onclick="toggleAdminDrawer(true)">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                    <span class="font-semibold text-gray-800 truncate text-sm sm:text-base">AI Course Admin</span>
                </div>
                <div class="hidden sm:flex space-x-1">
                    <a href="/admin/dashboard" class="text-gray-700 hover:text-gray-900 hover:bg-gray-100 px-3 py-2 rounded-md font-medium">Дашборд</a>
                    <a href="/admin/users" class="text-gray-700 hover:text-gray-900 hover:bg-gray-100 px-3 py-2 rounded-md font-medium">Пользователи</a>
                    <a href="/admin/course" class="text-gray-700 hover:text-gray-900 hover:bg-gray-100 px-3 py-2 rounded-md font-medium">Курс</a>
                    <a href="/admin/payments" class="text-gray-700 hover:text-gray-900 hover:bg-gray-100 px-3 py-2 rounded-md font-medium">Платежи</a>
                </div>
                <a href="/admin/logout" class="text-red-600 hover:text-red-800 font-medium text-sm shrink-0">Выйти</a>
            </div>
        </div>
    </nav>

    <div id="admin-overlay" class="fixed inset-0 bg-black/40 z-40 sm:hidden"
         onclick="toggleAdminDrawer(false)" aria-hidden="true"></div>
    <aside id="admin-drawer"
           class="fixed top-0 left-0 h-full w-64 max-w-[85vw] bg-white z-50 shadow-xl flex flex-col sm:hidden"
           aria-label="Админ меню" aria-hidden="true">
        <div class="flex items-center justify-between px-4 h-14 border-b">
            <span class="font-semibold text-gray-800">Меню</span>
            <button type="button" class="p-2 rounded-md text-gray-600 hover:bg-gray-100"
                    onclick="toggleAdminDrawer(false)" aria-label="Закрыть">
                <i class="fas fa-xmark text-lg"></i>
            </button>
        </div>
        <nav class="flex-1 p-3 space-y-1">
            <a href="/admin/dashboard" class="block text-gray-700 hover:bg-gray-100 px-3 py-2.5 rounded-md font-medium" onclick="toggleAdminDrawer(false)">Дашборд</a>
            <a href="/admin/users" class="block text-gray-700 hover:bg-gray-100 px-3 py-2.5 rounded-md font-medium" onclick="toggleAdminDrawer(false)">Пользователи</a>
            <a href="/admin/course" class="block text-gray-700 hover:bg-gray-100 px-3 py-2.5 rounded-md font-medium" onclick="toggleAdminDrawer(false)">Курс</a>
            <a href="/admin/payments" class="block text-gray-700 hover:bg-gray-100 px-3 py-2.5 rounded-md font-medium" onclick="toggleAdminDrawer(false)">Платежи</a>
        </nav>
        <div class="p-3 border-t">
            <a href="/admin/logout" class="block text-red-600 hover:bg-red-50 px-3 py-2.5 rounded-md font-medium">Выйти</a>
        </div>
    </aside>

    <main class="admin-main max-w-7xl mx-auto px-3 sm:px-4 pb-8">
        {% block content %}{% endblock %}
    </main>

    <script>
    function toggleAdminDrawer(forceOpen) {
        var drawer = document.getElementById('admin-drawer');
        var overlay = document.getElementById('admin-overlay');
        if (!drawer || !overlay) return;
        var open = typeof forceOpen === 'boolean' ? forceOpen : !drawer.classList.contains('open');
        drawer.classList.toggle('open', open);
        overlay.classList.toggle('open', open);
        drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
        document.body.classList.toggle('admin-drawer-open', open);
    }
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') toggleAdminDrawer(false);
    });
    </script>
</body>
</html>
